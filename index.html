```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Website Biodata Keren</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins', sans-serif;
background:
linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
url('images/bg.jpg');
background-size:cover;
background-position:center;
color:white;
}

/* HEADER */
.header{
width:85%;
margin:40px auto;
padding:40px;
border-radius:20px;
background:linear-gradient(135deg,#6a5acd,#00bfff);
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.header h1{
font-size:42px;
margin:0;
}

.header p{
font-size:18px;
opacity:0.9;
}

/* CARD */
.card{
width:350px;
margin:40px auto;
background:white;
color:black;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
text-align:center;
}

/* INPUT */
input, textarea{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
}

/* BUTTON */
button{
padding:12px 25px;
border:none;
border-radius:25px;
background:linear-gradient(135deg,#6a5acd,#00bfff);
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:0.8;
}

/* HASIL */
.hasil{
margin-top:20px;
padding:15px;
background:#f0f0f0;
border-radius:10px;
text-align:left;
}

/* SECTION */
.section{
width:90%;
margin:50px auto;
background:white;
color:black;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.section h2{
text-align:center;
font-size:30px;
}

/* IMAGE */
.img-box{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.img-box img{
width:250px;
margin:15px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<h1>✨ Tugas Praktik Web ✨</h1>
<p>Form Biodata dengan Tampilan Modern</p>
</div>

<!-- FORM -->
<div class="card">

<h2>📋 Form Biodata</h2>

<input type="text" id="nama" placeholder="Nama Lengkap">
<input type="text" id="kelas" placeholder="Kelas">
<input type="text" id="nis" placeholder="NIS">
<textarea id="alamat" placeholder="Alamat"></textarea>
<input type="date" id="lahir">

<button onclick="tampil()">Simpan</button>

<div id="hasil"></div>

</div>

<!-- TUGAS -->
<div class="section">

<h2>📸 Lampiran Screenshot</h2>

<div class="img-box">
<img src="images/foto1.png">
<img src="images/foto2.png">
<img src="images/foto3.png">
<img src="images/foto4.png">
<img src="images/foto5.png">
<img src="images/foto6.png">
<img src="images/foto7.png">
<img src="images/foto8.png">
</div>

</div>

<script>

function tampil(){

let nama = document.getElementById("nama").value
let kelas = document.getElementById("kelas").value
let nis = document.getElementById("nis").value
let alamat = document.getElementById("alamat").value
let lahir = document.getElementById("lahir").value

let umur = new Date().getFullYear() - new Date(lahir).getFullYear()

document.getElementById("hasil").innerHTML = `
<div class="hasil">
<p><b>Nama:</b> ${nama}</p>
<p><b>Kelas:</b> ${kelas}</p>
<p><b>NIS:</b> ${nis}</p>
<p><b>Alamat:</b> ${alamat}</p>
<p><b>Umur:</b> ${umur} tahun</p>
</div>
`

}

</script>

</body>
</html>
```
